name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            artifact: clutils-linux-x64
            setup-script: bash scripts/setup.sh

          - os: macos-latest
            triplet: arm64-osx          # Apple Silicon = fast & correct
            artifact: clutils-macos-arm64
            setup-script: bash scripts/setup.sh

          - os: windows-latest
            triplet: x64-windows
            artifact: clutils-windows-x64.exe
            setup-script: powershell -File scripts/setup.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      - name: Run setup script (clone vcpkg + build)
        run: ${{ matrix.setup-script }}
        shell: bash   # forces bash even on Windows (needed for the Linux/macOS jobs)

      - name: Prepare release binary
        shell: bash
        run: |
          mkdir -p release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp build/Release/clutils.exe release/${{ matrix.artifact }}
          else
            cp build/clutils release/${{ matrix.artifact }}
            chmod +x release/${{ matrix.artifact }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            */clutils-*
          generate_release_notes: true