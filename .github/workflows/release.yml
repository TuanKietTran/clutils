name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Step 1: Clone & cache vcpkg once
  prepare-vcpkg:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Cache vcpkg
        id: cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-2025-12-06
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Clone vcpkg (if cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

  # Step 2: Build on all platforms (uses cached vcpkg)
  build:
    needs: prepare-vcpkg
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            artifact: clutils-linux-x64
            deps: sudo apt-get update && sudo apt-get install -y libuuid-dev ninja-build

          - os: macos-latest
            triplet: arm64-osx
            artifact: clutils-macos-arm64

          - os: windows-latest
            triplet: x64-windows
            artifact: clutils-windows-x64.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        if: matrix.deps
        run: ${{ matrix.deps }}

      - name: Restore vcpkg from cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-2025-12-06

      - name: Run setup script
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "=== Windows detected ==="
            powershell -File scripts/setup.ps1
          else
            echo "=== macOS/Linux detected ==="
            bash scripts/setup.sh
          fi

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp build/clutils.exe release/${{ matrix.artifact }}
          else
            cp build/clutils release/${{ matrix.artifact }}
            chmod +x release/${{ matrix.artifact }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

  # Step 3: Release
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: "*/clutils-*"
          generate_release_notes: true