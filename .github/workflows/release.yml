name: Release

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            triplet: x64-linux
            artifact: clutils-linux-x64
            setup: bash scripts/setup.sh
            deps: sudo apt-get update && sudo apt-get install -y libuuid-dev ninja-build

          - os: macos-latest
            triplet: arm64-osx
            artifact: clutils-macos-arm64
            setup: bash scripts/setup.sh

          - os: windows-latest
            triplet: x64-windows
            artifact: clutils-windows-x64.exe
            setup: powershell -File scripts/setup.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        if: matrix.deps
        run: ${{ matrix.deps }}

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            !vcpkg/downloads
            !vcpkg/buildtrees
          key: vcpkg-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: Run setup script
        run: ${{ matrix.setup }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir release
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp build/clutils.exe release/${{ matrix.artifact }}
          else
            cp build/clutils release/${{ matrix.artifact }}
            chmod +x release/${{ matrix.artifact }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: "*/clutils-*"
          generate_release_notes: true